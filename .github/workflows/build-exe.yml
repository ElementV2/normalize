name: Exécutable Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # nécessaire pour publier la Release

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-exe:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer PyInstaller et tkinterdnd2
        run: python -m pip install --upgrade pip pyinstaller tkinterdnd2

      - name: Télécharger ffmpeg (build LGPL stable, BtbN)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN" }
          $rel = Invoke-RestMethod "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest" -Headers $headers
          # Dernière version stable (ffmpeg-nX.Y-latest-win64-lgpl-shared-X.Y.zip), sinon « master »
          $asset = $rel.assets |
            Where-Object { $_.name -match '^ffmpeg-n(\d+\.\d+)-latest-win64-lgpl-shared-[\d.]+\.zip$' } |
            Sort-Object { [version]($_.name -replace '^ffmpeg-n(\d+\.\d+)-.*$', '$1') } -Descending |
            Select-Object -First 1
          if (-not $asset) {
            $asset = $rel.assets | Where-Object { $_.name -eq 'ffmpeg-master-latest-win64-lgpl-shared.zip' }
          }
          if (-not $asset) { throw "Aucun build ffmpeg Windows trouvé" }
          Write-Host "ffmpeg : $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_dl
          $bin = Get-ChildItem ffmpeg_dl -Recurse -Directory -Filter bin | Select-Object -First 1
          New-Item -ItemType Directory -Force ffmpeg_win | Out-Null
          Copy-Item "$($bin.FullName)\*" ffmpeg_win
          Remove-Item ffmpeg_win\ffplay.exe -ErrorAction SilentlyContinue
          Get-ChildItem ffmpeg_win
          "FFMPEG_ASSET=$($asset.name)" | Out-File -Append $env:GITHUB_ENV

      - name: Tests (avec le ffmpeg qui sera intégré)
        env:
          NORMALIZE_FFMPEG: ${{ github.workspace }}\ffmpeg_win\ffmpeg.exe
          NORMALIZE_FFPROBE: ${{ github.workspace }}\ffmpeg_win\ffprobe.exe
        run: python -m unittest -v

      - name: Construire NormaliseurVideo.exe
        run: python packaging/build_exe.py --ffmpeg-dir ffmpeg_win

      - name: Auto-test de l'exe compilé
        shell: pwsh
        run: |
          # L'auto-test vérifie aussi que l'exe utilise bien son ffmpeg intégré
          $report = "$PWD\smoke.json"
          $p = Start-Process -FilePath dist\NormaliseurVideo.exe -ArgumentList "--smoke-test", "`"$report`"" -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "L'auto-test a échoué (code $($p.ExitCode))" }
          $size = [math]::Round((Get-Item dist\NormaliseurVideo.exe).Length / 1MB, 1)
          Write-Host "Taille : $size Mo"

      - uses: actions/upload-artifact@v4
        with:
          name: NormaliseurVideo-windows
          path: dist/NormaliseurVideo.exe
          if-no-files-found: error

      - name: Publier la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NormaliseurVideo.exe
          body: |
            ## Normaliseur de volume vidéo — Windows

            **[⬇ Télécharger NormaliseurVideo.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/NormaliseurVideo.exe)**

            Un seul fichier, rien à installer : ffmpeg est inclus.

            1. Téléchargez `NormaliseurVideo.exe` et double-cliquez dessus.
            2. Glissez-déposez vos vidéos (ou des dossiers) dans la fenêtre,
               ou directement sur l'icône de l'exe.
            3. Choisissez le niveau cible et cliquez sur **Normaliser**.

            Les vidéos normalisées sont créées à côté des originales
            (suffixe `_normalise`), ou dans le dossier de sortie choisi.

            > **Windows SmartScreen** : l'exe n'étant pas signé, Windows peut afficher
            > « Windows a protégé votre ordinateur ». Cliquez sur
            > **Informations complémentaires → Exécuter quand même**.

            Inclut ffmpeg (${{ env.FFMPEG_ASSET }}, licence LGPL) — https://ffmpeg.org
