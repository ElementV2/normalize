[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "normalize-video"
version = "1.0.0"
description = "Normalise le volume sonore de plusieurs vidéos au même niveau (EBU R128, ffmpeg)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "tkinterdnd2>=0.4",  # glisser-déposer dans l'interface graphique
]

[project.scripts]
normalize-video = "normalize_video.cli:main"

[project.gui-scripts]
normalize-video-gui = "normalize_video.gui:main"

[tool.setuptools]
packages = ["normalize_video"]
